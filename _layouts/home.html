---
layout: default
---

<div class="home">
  <h2 style="text-align: center; font-size: 1.2rem; color: #666; margin-bottom: 1.5rem;">最近更新</h2>
  {% for post in site.posts %}
    <article>
      <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
      <span>{{ post.date | date: "%Y-%m-%d" }}</span>
      <p>{{ post.excerpt }}</p>
    </article>
  {% endfor %}
</div>
