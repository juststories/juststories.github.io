---
layout: default
---

<article class="page">
  <header>
    <style>
      /* 文章标题居中，向下移动 */
      .page__title {
        text-align: center !important;
        margin-top: 2rem !important;
        margin-bottom: 1.5rem !important;
      }

      /* 正文样式：与评论框同宽 */
      .page__content {
        font-size: 1.2rem;
        line-height: 2;
        max-width: 100%;
        margin: 0 auto;
        color: #1a1a1a;
      }

      .page__content p {
        margin-bottom: 1.8em;
        text-indent: 2em;
      }

      /* 分享按钮样式 */
      .share {
        display: flex;
        gap: 0.8rem;
        justify-content: center;
        margin: 2.5rem 0 1.5rem 0;
        flex-wrap: wrap;
      }

      .share a {
        padding: 0.4rem 1.2rem;
        color: #fff;
        border-radius: 4px;
        text-decoration: none;
        font-size: 0.85rem;
        transition: opacity 0.2s;
      }

      .share a:hover {
        opacity: 0.8;
      }

      .share .twitter {
        background: #1DA1F2;
      }

      .share .facebook {
        background: #1877F2;
      }

      .share .linkedin {
        background: #0A66C2;
      }

      .share .weibo {
        background: #E6162D;
      }
    </style>
    <h1 class="page__title">{{ page.title }}</h1>
    <p class="page__meta">发布于 {{ page.date | date: "%Y-%m-%d" }}</p>
  </header>

  <div class="page__content">
    {{ content }}
  </div>

  <!-- 社交分享按钮 -->
  {% if page.share != false %}
  <div class="share">
    <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer" class="twitter">Twitter</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer" class="facebook">Facebook</a>
    <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer" class="linkedin">LinkedIn</a>
    <a href="https://service.weibo.com/share/share.php?title={{ page.title | url_encode }}&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer" class="weibo">微博</a>
  </div>
  {% endif %}

  <!-- Giscus 评论区 -->
  <script src="https://giscus.app/client.js"
          data-repo="juststories/juststories.github.io"
          data-repo-id="R_kgDOTpbEhw"
          data-category="General"
          data-category-id="DIC_kwDOTpbEh84DCnXx"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>
</article>
