remote_theme: "mmistakes/minimal-mistakes@4.24.0"

# ===== 站点信息 =====
title: "俗世闲想"
subtitle: "Just Stories"
title_separator: "|"
name: "郑好"
description: 六便士养活肉身，月亮安顿灵魂
locale: "zh-CN"
timezone: "Asia/Shanghai"

# ===== 作者信息 =====
author:
  name: "郑好"
  avatar: "/assets/avatars/avatar1.jpg"
  bio: "你来看此花时，则此花颜色一时明白起来。"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:luna_just@qq.com"

# ===== 配色皮肤（视觉细节由 assets/css/custom.css 接管）=====
minimal_mistakes_skin: "air"

# ===== 侧边栏 =====
author_profile: true

# ===== 页脚 =====
footer:
  links: []

# ===== 插件 =====
plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

# ===== 评论系统 =====
comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOTpbEhw"
    category_name: "General"
    category_id: "DIC_kwDOTpbEh84DCnXx"
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "preferred_color_scheme"
    lang: "zh-CN"

# ===== 文章默认值：安静的书卷式阅读 =====
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      comments: true
      share: false
      read_time: false

# ===== 搜索 =====
search: true
search_full_content: true
