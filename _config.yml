remote_theme: "mmistakes/minimal-mistakes@4.24.0"

# ===== 网站标题 =====
title: "俗世闲想"
subtitle: "Just Stories"
title_separator: "|"
name: "郑好"

# ===== 网站描述 =====
description: 六便士养活肉身，月亮安顿灵魂

# ===== 作者信息 =====
author:
  name: "郑好"
  avatar: "/assets/avatars/avatar1.jpg"
  bio: "你来看此花时，则此花颜色一时明白起来。"
#  location: "中国"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:luna_just@qq.com"

# ===== 配色皮肤 =====
minimal_mistakes_skin: "air"

# ===== 侧边栏 =====
author_profile: true

# ===== 页脚 =====
footer:
  links: []

# ===== 必要插件 =====
plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed

# ===== 评论系统 =====
comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOTpbEhw"
    category_name: "General"
    category_id: "DIC_kwDOTpbEh84DCnXx"
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "preferred_color_scheme"
    lang: "zh-CN"

# ===== 全局默认配置 =====
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      comments: true
      share: true
      sidebar:
      nav: "categories_sidebar"
